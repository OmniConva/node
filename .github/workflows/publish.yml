name: publish

# Stages a new npm version when a GitHub release is published (tag vX.Y.Z),
# using npm trusted publishing: GitHub's OIDC identity instead of a stored
# token. The package's npm settings trust exactly this repository and this
# file, and only to stage: the version goes live once a maintainer approves
# it under npm > Staged Packages (with 2FA), or with `npm stage approve`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm 12 (which needs Node 24.15 or newer).
      - run: npm install -g npm@^12

      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/version.ts)"
          echo "tag=$tag package.json=$pkg src/version.ts=$src"
          test "$tag" = "$pkg" && test "$pkg" = "$src"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No token: npm exchanges the workflow's OIDC token, and attaches a
      # provenance statement automatically. Staged, not live, until approved.
      - run: npm stage publish --access public
